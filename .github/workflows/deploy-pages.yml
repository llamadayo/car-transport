name: Deploy to GitHub Pages

# 暫停自動部署；僅可在 Actions 頁面手動觸發
on:
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只保留一次部署，新的推送會取消進行中的舊部署
# 註：原本的 group "pages" 被一個無法取消的殭屍 run 永久佔用（GitHub 端異常，
# API 顯示 queued 但從未入列、cancel 回 409），導致後續 run 全部排隊等不到。
# 改用新的 group 名稱以跳脫該死結；沿用 cancel-in-progress 維持原本行為。
concurrency:
  group: pages-deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若 repo 尚未啟用 Pages，嘗試自動啟用（免手動進 Settings）
          enablement: true

      - name: Prepare prototype only
        shell: bash
        run: |
          mkdir -p artifacts/pages/js/vendor artifacts/pages/css artifacts/pages/docs
          cp index.html artifacts/pages/
          cp css/styles.css artifacts/pages/css/
          cp js/app.js js/data.js js/loadengine.js js/moduleA.js js/moduleB.js js/moduleC.js artifacts/pages/js/
          cp js/vendor/masonry.pkgd.min.js artifacts/pages/js/vendor/
          cp docs/*.html artifacts/pages/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 僅發布原型，MVC 原始碼／設定／授權套件不進入 Pages。
          path: artifacts/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
